name: Daily blog publish

on:
  schedule:
    # 22:00 UTC = 07:00 KST (한국시간 매일 아침 7시)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "발행 방식"
        type: choice
        default: publish
        options: [publish, draft, dry-run]
      lang:
        description: "언어"
        type: choice
        default: both
        options: [both, ko, en]
      topic:
        description: "주제 id 강제 지정 (비우면 자동)"
        type: string
        default: ""

concurrency:
  group: daily-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: |
          missing=""
          for name in ANTHROPIC_API_KEY BLOGGER_BLOG_ID GOOGLE_CLIENT_ID \
                      GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN IMAGE_BASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 값:$missing"
            echo "Settings > Secrets and variables > Actions 에서 확인하세요."
            echo "(IMAGE_BASE_URL 은 Secrets 가 아니라 Variables 탭입니다)"
            exit 1
          fi
          echo "필수 값 6개 모두 확인됨"

      - name: Probe APIs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          echo "--- 구글 값 형태 (값은 노출되지 않음) ---"
          python - <<'EOF'
          import os
          for name in ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REFRESH_TOKEN"):
              v = os.environ.get(name, "")
              print(f"{name}: 길이 {len(v)}, 정리 후 {len(v.strip())}")
          cid = os.environ.get("GOOGLE_CLIENT_ID", "").strip()
          print(f"CLIENT_ID 접미사 정상: {cid.endswith('.apps.googleusercontent.com')}")
          print(f"CLIENT_SECRET prefix 정상: {os.environ.get('GOOGLE_CLIENT_SECRET', '').strip().startswith('GOCSPX-')}")
          EOF
          # 발행 코드(src/settings.py)와 똑같이 앞뒤 공백·줄바꿈을 정리한 값으로 확인한다
          CID=$(printf '%s' "$GOOGLE_CLIENT_ID" | tr -d '[:space:]')
          CSECRET=$(printf '%s' "$GOOGLE_CLIENT_SECRET" | tr -d '[:space:]')
          RTOKEN=$(printf '%s' "$GOOGLE_REFRESH_TOKEN" | tr -d '[:space:]')
          echo "--- 구글 토큰 확인 ---"
          code=$(curl -s -o /tmp/g.json -w "%{http_code}" \
            --data-urlencode "client_id=$CID" \
            --data-urlencode "client_secret=$CSECRET" \
            --data-urlencode "refresh_token=$RTOKEN" \
            -d "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)
          if [ "$code" = "200" ]; then
            echo "구글 토큰 정상"
          elif grep -q invalid_client /tmp/g.json; then
            echo "::error title=구글 클라이언트 불일치::GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET 이 Google Cloud 의 OAuth 클라이언트와 맞지 않습니다 (HTTP $code)."
            echo "로컬 .env 의 두 값을 GitHub Secrets 에 다시 넣으세요."
            cat /tmp/g.json
            exit 1
          else
            echo "::error title=구글 토큰 만료::refresh token 이 더 이상 유효하지 않습니다 (HTTP $code)."
            echo "복구 방법:"
            echo " 1) 로컬에서  python scripts/get_refresh_token.py  실행"
            echo " 2) .env 의 GOOGLE_REFRESH_TOKEN 값을 GitHub Secrets 에 Update"
            echo " 3) 근본 해결: Google Cloud 콘솔에서 앱을 '프로덕션'으로 게시"
            cat /tmp/g.json
            exit 1
          fi
          echo "--- 키 형태 (값은 노출되지 않음) ---"
          python - <<'EOF'
          import os
          k = os.environ.get("ANTHROPIC_API_KEY", "")
          print(f"길이 {len(k)}, 정리 후 {len(k.strip())}")
          print(f"prefix {k.strip()[:7]!r}")
          print(f"내부 공백/줄바꿈 포함: {any(c.isspace() for c in k.strip())}")
          EOF
          echo "--- api.anthropic.com 연결 ---"
          curl -s -o /dev/null -w "HTTP %{http_code} (연결 %{time_connect}s)\n" \
            -X POST https://api.anthropic.com/v1/messages \
            -H "x-api-key: $(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{"model":"claude-sonnet-5","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}' \
            || echo "curl 실패 — 네트워크 문제"

      - name: Build flags
        id: flags
        run: |
          MODE="${{ inputs.mode || 'publish' }}"
          POST_LANG="${{ inputs.lang || 'both' }}"
          TOPIC="${{ inputs.topic }}"
          FLAGS="--lang $POST_LANG"
          if [ "$MODE" = "draft" ]; then
            FLAGS="$FLAGS --draft"
          elif [ "$MODE" = "dry-run" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "$TOPIC" ]; then
            FLAGS="$FLAGS --topic $TOPIC"
          fi
          echo "실행 옵션: $FLAGS"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: python -m src.publish ${{ steps.flags.outputs.flags }}

      - name: Commit state
        if: success()
        run: |
          git config user.name "aroha-bot"
          git config user.email "actions@github.com"
          git add state config/topics.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: publish log $(date -u +%Y-%m-%d)"
          # 원격이 앞서 있으면 rebase 후 재시도한다.
          # 이 커밋이 유실되면 다음 날 같은 주제를 다시 발행하게 된다.
          for i in 1 2 3; do
            git push && exit 0
            echo "push 실패, 원격을 받아 재시도 ($i/3)"
            git pull --rebase origin main || exit 1
          done
          echo "::error title=발행 기록 저장 실패::state 를 푸시하지 못했습니다. 중복 발행 위험이 있습니다."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### 호텔아로하 블로그 발행"
            echo ""
            echo "- 실행: ${{ github.event_name }}"
            echo "- 결과: ${{ job.status }}"
            if [ "${{ job.status }}" != "success" ]; then
              echo ""
              echo "실패했습니다. 위 단계 로그를 확인하세요."
              echo "구글 토큰 만료가 가장 흔한 원인입니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview (dry-run only)
        if: inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
