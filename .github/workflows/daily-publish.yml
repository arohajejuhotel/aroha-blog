name: Daily blog publish

on:
  schedule:
    # 22:00 UTC = 07:00 KST (한국시간 매일 아침 7시)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "발행 방식"
        type: choice
        default: publish
        options: [publish, draft, dry-run]
      lang:
        description: "언어"
        type: choice
        default: both
        options: [both, ko, en]
      topic:
        description: "주제 id 강제 지정 (비우면 자동)"
        type: string
        default: ""

concurrency:
  group: daily-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: |
          missing=""
          for name in ANTHROPIC_API_KEY BLOGGER_BLOG_ID GOOGLE_CLIENT_ID \
                      GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN IMAGE_BASE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 값:$missing"
            echo "Settings > Secrets and variables > Actions 에서 확인하세요."
            echo "(IMAGE_BASE_URL 은 Secrets 가 아니라 Variables 탭입니다)"
            exit 1
          fi
          echo "필수 값 6개 모두 확인됨"

      - name: Build flags
        id: flags
        run: |
          MODE="${{ inputs.mode || 'publish' }}"
          POST_LANG="${{ inputs.lang || 'both' }}"
          TOPIC="${{ inputs.topic }}"
          FLAGS="--lang $POST_LANG"
          if [ "$MODE" = "draft" ]; then
            FLAGS="$FLAGS --draft"
          elif [ "$MODE" = "dry-run" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "$TOPIC" ]; then
            FLAGS="$FLAGS --topic $TOPIC"
          fi
          echo "실행 옵션: $FLAGS"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
        run: python -m src.publish ${{ steps.flags.outputs.flags }}

      - name: Commit state
        if: success()
        run: |
          git config user.name "aroha-bot"
          git config user.email "actions@github.com"
          git add state/published.json config/topics.json
          git diff --staged --quiet || git commit -m "chore: publish log $(date -u +%Y-%m-%d)"
          git push

      - name: Upload preview (dry-run only)
        if: inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/
